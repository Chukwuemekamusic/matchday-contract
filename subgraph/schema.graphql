# MatchDayBet Subgraph Schema (V1-V3 contract events)

# Enums
enum MatchStatus {
  OPEN
  CLOSED
  RESOLVED
  CANCELLED
}

enum Outcome {
  NONE
  HOME
  DRAW
  AWAY
}

"""
Settlement state of a single bet, set when its match is resolved or cancelled
"""
enum BetResult {
  PENDING # match not settled yet
  WON # picked the winning outcome (payout may equal stake when everyone picked it)
  LOST # picked a losing outcome while someone picked the winner
  REFUND # match cancelled, or nobody picked the winning outcome
}

enum SkipReason {
  NONE
  ALREADY_RESOLVED_SAME_RESULT
  ALREADY_RESOLVED_DIFFERENT_RESULT
  ALREADY_CLOSED
  ALREADY_CANCELLED
  MATCH_NOT_FOUND
  MATCH_IS_RESOLVED
  MATCH_IS_CANCELLED
  KICKOFF_NOT_REACHED
  INVALID_OUTCOME
}

# Core Entities

"""
Represents a football match betting market
"""
type Match @entity(immutable: false) {
  id: ID! # matchId as string
  matchId: BigInt!
  homeTeam: String!
  awayTeam: String!
  competition: String!
  kickoffTime: BigInt!

  # Pools
  totalPool: BigInt!
  homePool: BigInt!
  drawPool: BigInt!
  awayPool: BigInt!

  # Bet counts
  homeBetCount: BigInt!
  drawBetCount: BigInt!
  awayBetCount: BigInt!
  totalBetCount: BigInt!

  # Status
  status: MatchStatus!
  result: Outcome!
  winnerPool: BigInt! # pool of the winning outcome, set on resolution
  platformFeeAmount: BigInt!

  # Timestamps
  createdAt: BigInt!
  createdAtBlock: BigInt!
  closedAt: BigInt
  resolvedAt: BigInt
  cancelledAt: BigInt

  # Pause state (V2 feature)
  isPaused: Boolean!

  # Financial tracking (V2 feature)
  totalClaimed: BigInt!

  # Relationships
  bets: [Bet!]! @derivedFrom(field: "match")

  # Cancellation reason (if cancelled)
  cancellationReason: String
}

"""
Represents a single bet placed by a user
"""
type Bet @entity(immutable: false) {
  id: ID! # matchId-userAddress
  match: Match!
  bettor: User!
  amount: BigInt!
  prediction: Outcome!
  result: BetResult!
  claimed: Boolean!

  # Set when the match settles (same formula as the contract's payout)
  payout: BigInt # amount the bettor can claim (0 for LOST)
  profit: BigInt # payout - amount (negative for LOST, 0 for REFUND)

  # Timestamps
  placedAt: BigInt!
  placedAtBlock: BigInt!
  settledAt: BigInt
  claimedAt: BigInt

  # Transaction reference
  txHash: Bytes!
}

"""
Represents a user (bettor)
"""
type User @entity(immutable: false) {
  id: ID! # User address
  address: Bytes!

  # Betting statistics
  totalBets: BigInt!
  totalWagered: BigInt!
  totalWon: BigInt! # Gross payout of WON bets (claimed or not)
  totalClaimed: BigInt! # Winnings + refunds actually withdrawn
  totalProfit: BigInt! # Net result of settled bets, can be negative

  # Win/loss record (counted at settlement, not at claim)
  winCount: BigInt!
  lossCount: BigInt!
  refundCount: BigInt!

  # Relationships
  bets: [Bet!]! @derivedFrom(field: "bettor")

  # Activity timestamps
  firstBetAt: BigInt!
  lastBetAt: BigInt!
  lastActivityAt: BigInt!
}

"""
Global protocol statistics
"""
type GlobalStats @entity(immutable: false) {
  id: ID! # Always "1"

  # Match statistics
  totalMatches: BigInt!
  activeMatches: BigInt!
  resolvedMatches: BigInt!
  cancelledMatches: BigInt!

  # Betting statistics
  totalBets: BigInt!
  totalVolume: BigInt!
  totalFeesCollected: BigInt!
  totalPayouts: BigInt!

  # User statistics
  uniqueBettors: BigInt!

  # V3 Statistics
  currentGracePeriod: BigInt! # Current grace period in seconds
  totalBatchResolutions: BigInt! # Number of batch resolution operations
  totalBatchCancellations: BigInt! # Number of batch cancellation operations
  totalSkippedResolutions: BigInt! # Total matches skipped during resolution
  totalSkippedCancellations: BigInt! # Total matches skipped during cancellation

  # Last updated
  lastUpdatedAt: BigInt!
}

"""
Match managers (bot addresses) - admin tracking
"""
type MatchManager @entity(immutable: false) {
  id: ID! # Manager address
  address: Bytes!
  isActive: Boolean!
  addedAt: BigInt!
  addedAtBlock: BigInt!
  removedAt: BigInt
  removedAtBlock: BigInt
}

"""
Contract upgrade tracking (from UUPS proxy)
"""
type Upgraded @entity(immutable: true) {
  id: Bytes!
  implementation: Bytes! # New implementation address
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

"""
Platform configuration changes
"""
type ConfigUpdate @entity(immutable: true) {
  id: ID! # txHash-logIndex
  type: String! # "STAKE_LIMITS" | "PLATFORM_FEE"

  # Stake limits
  minStake: BigInt
  maxStake: BigInt

  # Platform fee
  platformFeeBps: BigInt

  # Metadata
  blockNumber: BigInt!
  timestamp: BigInt!
  transactionHash: Bytes!
}

# ============ V3 Entities ============

"""
Track individual skipped match resolutions (V3)
"""
type MatchResolutionSkip @entity(immutable: true) {
  id: ID! # txHash-logIndex-matchId
  match: Match!
  skipReason: SkipReason!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

"""
Track batch resolution operations summary (V3)
"""
type BatchResolutionSummary @entity(immutable: true) {
  id: ID! # txHash-logIndex
  matchIds: [BigInt!]!
  results: [Outcome!]!
  resolvedCount: BigInt!
  skippedCount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

"""
Track individual skipped match cancellations (V3)
"""
type MatchCancellationSkip @entity(immutable: true) {
  id: ID! # txHash-logIndex-matchId
  match: Match!
  skipReason: SkipReason!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

"""
Track batch cancellation operations summary (V3)
"""
type BatchCancellationSummary @entity(immutable: true) {
  id: ID! # txHash-logIndex
  matchIds: [BigInt!]!
  reason: String!
  cancelledCount: BigInt!
  skippedCount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

"""
Track grace period configuration changes (V3)
"""
type GracePeriodUpdate @entity(immutable: true) {
  id: ID! # txHash-logIndex
  newGracePeriod: BigInt!
  previousGracePeriod: BigInt
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}
